name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Test sources stay local (not in the repository): this compiles everything and checks the shipped jars.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: friends-plugins
          path: builds/*.jar
