name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Test sources stay local (not in the repository): this compiles everything and checks the shipped jars.
      # The jars themselves are attached to GitHub releases (release.yml), not to PR or push runs.
      - run: ./gradlew build
