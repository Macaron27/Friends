name: Friends
main: com.friends.paper.FriendsBootstrap
version: ${version}
# Ignored by 1.8-1.12; tells 1.13+ this is not a legacy plugin.
api-version: "1.13"
description: Hypixel-style friends system
softdepend: [LuckPerms]
# Folia (regionized Paper): Friends runs off the server threads and uses no Bukkit scheduler.
folia-supported: true
commands:
  friend:
    description: Friends commands
    aliases: [f, friends]
    permission: friends.use
  fl:
    description: List your friends
    permission: friends.use
  status:
    description: Set the status your friends see
    permission: friends.use
permissions:
  friends.use:
    description: Use the friends commands
    default: true
